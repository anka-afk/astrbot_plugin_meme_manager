<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>语义表情包</title>
    <link rel="stylesheet" href="./fa.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Semantic Meme Workspace</p>
        <h1><i class="fas fa-wand-magic-sparkles icon"></i>语义表情包</h1>
        <p class="subtitle">
          为图片生成描述和向量索引，让回复模型按语义选择更合适的表情包。
        </p>
      </div>
      <div class="nav-actions stacked-nav" aria-label="页面导航">
        <a
          class="nav-link nav-layer nav-layer-left"
          href="../catalog/index.html"
          data-nav-target="../catalog/index.html"
          data-nav-view="catalog"
          ><i class="fas fa-chevron-left icon"></i>资源广场</a
        >
        <a
          class="nav-link nav-layer nav-layer-center"
          href="../a_manage/index.html"
          data-nav-target="../a_manage/index.html"
          ><i class="fas fa-gear icon"></i>返回管理页</a
        >
        <a
          class="nav-link nav-layer nav-layer-right"
          href="../settings/index.html"
          data-nav-target="../settings/index.html"
          ><i class="fas fa-chevron-right icon"></i>设置中心</a
        >
      </div>
    </header>

    <main class="layout">
      <section class="panel control-panel">
        <div class="panel-header">
          <div>
            <h2><i class="fas fa-gears icon"></i>语义化任务</h2>
            <p class="panel-hint">
              一键完整语义化只处理尚无描述或上次失败的图片，已有描述不会重做；如需覆盖请使用“强制重新生成”。
            </p>
          </div>
          <div class="control-fields">
            <div class="field-row pack-field">
              <label for="pack">资源包</label>
              <select id="pack" aria-label="选择资源包"></select>
            </div>
            <div class="field-row concurrency-field">
              <label for="concurrency">模型调用并发上限</label>
              <input
                id="concurrency"
                type="number"
                min="1"
                max="16"
                step="1"
                value="1"
                aria-describedby="concurrency-hint"
              />
              <small id="concurrency-hint"
                >同时提交给视觉模型的图片上限，建议按模型限流设置。</small
              >
            </div>
          </div>
        </div>
        <div class="button-row action-row">
          <button type="button" data-action="start">
            <i class="fas fa-play icon"></i>一键完整语义化
          </button>
          <button type="button" class="secondary" data-action="resume">
            <i class="fas fa-forward icon"></i>继续队列
          </button>
          <button type="button" class="secondary" data-action="retry">
            <i class="fas fa-rotate-right icon"></i>重试失败项
          </button>
          <button type="button" class="ghost" data-action="pause">
            <i class="fas fa-pause icon"></i>立即暂停任务
          </button>
          <button type="button" class="ghost" data-action="index">
            <i class="fas fa-database icon"></i>建立或重建索引
          </button>
          <button type="button" class="secondary" data-action="dimension">
            <i class="fas fa-ruler-combined icon"></i>按当前维度重建向量
          </button>
          <button type="button" class="danger" data-action="clear">
            <i class="fas fa-broom icon"></i>清空当前任务队列
          </button>
          <button type="button" class="danger" data-action="delete-all">
            <i class="fas fa-trash-can icon"></i>删除当前包全部语义化
          </button>
          <button type="button" class="danger" data-action="force">
            <i class="fas fa-arrows-rotate icon"></i>强制重新生成
          </button>
        </div>
        <p id="notice" class="result" aria-live="polite"></p>
        <p
          id="other-tasks-warning"
          class="result warning"
          aria-live="polite"
        ></p>
      </section>

      <section class="panel status-panel">
        <div class="panel-header">
          <h2><i class="fas fa-chart-line icon"></i>任务状态</h2>
          <div class="status-header-tools">
            <span class="badge" id="task-timer">用时 00:00:00</span>
            <span class="badge" id="status-refresh-label">自动刷新</span>
          </div>
        </div>
        <div id="status" class="status-grid" aria-live="polite"></div>
      </section>

      <section class="panel records-panel">
        <div class="panel-header">
          <h2><i class="fas fa-list-check icon"></i>最近记录</h2>
          <div class="records-toolbar">
            <label class="filter-label" for="records-filter">筛选</label>
            <select
              id="records-filter"
              class="records-filter"
              aria-label="按任务状态筛选"
            >
              <option value="all">全部</option>
              <option value="pending">待处理</option>
              <option value="running">进行中</option>
              <option value="failed">全部失败</option>
              <option value="caption_failed">描述失败</option>
              <option value="embedding_failed">向量失败</option>
              <option value="caption_done">描述已完成</option>
              <option value="embedding_done">向量已完成</option>
              <option value="reclassified">自动重分类</option>
              <option value="completed">全部完成</option>
            </select>
            <span class="badge" id="record-count">0</span>
            <button type="button" class="ghost page-button" id="records-prev">
              上一页
            </button>
            <span class="page-label" id="records-page">第 1 / 1 页</span>
            <button type="button" class="ghost page-button" id="records-next">
              下一页
            </button>
          </div>
        </div>
        <div id="items" class="records"></div>
      </section>
    </main>

    <div id="dialog-mask" class="dialog-mask hidden" aria-hidden="true">
      <section
        class="dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="dialog-title"
      >
        <h3 id="dialog-title"></h3>
        <p id="dialog-message" class="dialog-message"></p>
        <div class="dialog-actions">
          <button id="dialog-cancel" type="button" class="ghost">取消</button>
          <button id="dialog-confirm" type="button">确定</button>
        </div>
      </section>
    </div>
    <div id="image-preview-mask" class="dialog-mask hidden" aria-hidden="true">
      <section
        class="image-preview-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="image-preview-title"
      >
        <div class="image-preview-header">
          <h3 id="image-preview-title">表情包预览</h3>
          <button id="image-preview-close" type="button" class="ghost">
            关闭
          </button>
        </div>
        <div class="image-preview-stage">
          <img id="image-preview-img" alt="表情包大图预览" />
          <span id="image-preview-loading">正在加载大图……</span>
        </div>
      </section>
    </div>
    <div id="toast-container" class="toast-container" aria-live="polite"></div>

    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script type="module" src="./script.js"></script>
  </body>
</html>
