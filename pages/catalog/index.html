<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情包资源广场</title>
    <link rel="stylesheet" href="./fa.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Meme Pack Catalog</p>
        <h1><i class="fas fa-store icon"></i>表情包资源广场</h1>
        <p class="subtitle">下载并安装官方与社区表情包。</p>
      </div>
      <div class="nav-actions stacked-nav" aria-label="页面导航">
        <a
          class="nav-link nav-layer nav-layer-left"
          href="../settings/index.html"
          data-nav-target="../settings/index.html"
          ><i class="fas fa-chevron-left icon"></i>设置中心</a
        >
        <a
          class="nav-link nav-layer nav-layer-center"
          href="../a_manage/index.html"
          data-nav-target="../a_manage/index.html"
          ><i class="fas fa-gear icon"></i>返回管理页</a
        >
        <a
          class="nav-link nav-layer nav-layer-right"
          href="../semantic/index.html"
          data-nav-target="../semantic/index.html"
          ><i class="fas fa-chevron-right icon"></i>语义化</a
        >
      </div>
    </header>

    <main class="layout">
      <section class="panel catalog-list official-zone">
        <div class="panel-header">
          <h2><i class="fas fa-crown icon"></i>官方包</h2>
          <span id="official-pack-count" class="badge">0</span>
        </div>
        <div id="official-grid" class="catalog-grid empty">
          <p>暂无官方包。</p>
        </div>
      </section>

      <section class="panel catalog-list community-zone">
        <div class="panel-header">
          <h2><i class="fas fa-users icon"></i>社区包</h2>
          <span id="community-pack-count" class="badge">0</span>
        </div>
        <div id="community-grid" class="catalog-grid empty">
          <p>暂无社区包。</p>
        </div>
      </section>

      <section class="panel manual-source">
        <h2><i class="fab fa-github icon"></i>手动 GitHub 来源安装</h2>
        <p class="manual-source-hint">
          <i class="fas fa-circle-info"></i>
          支持兼容结构的表情包；未收录来源会在安装时自动识别结构。
        </p>
        <div class="triple-grid">
          <div class="field-row">
            <label for="source-repo-input">Repo</label>
            <input
              id="source-repo-input"
              type="text"
              placeholder="owner/repo"
            />
          </div>
          <div class="field-row">
            <label for="source-ref-input">Ref</label>
            <input id="source-ref-input" type="text" placeholder="main" />
          </div>
          <div class="field-row">
            <label for="source-subpath-input">Subpath</label>
            <input
              id="source-subpath-input"
              type="text"
              placeholder="packs/official-basic"
            />
          </div>
        </div>
        <div class="button-row">
          <button id="install-source-btn">
            <i class="fas fa-download icon"></i>按来源安装
          </button>
        </div>
      </section>

      <section class="panel log-panel">
        <h2><i class="fas fa-list-check icon"></i>操作日志</h2>
        <div id="log-list" class="log-list"></div>
      </section>
    </main>

    <div id="install-dialog" class="dialog-mask hidden" aria-hidden="true">
      <div class="dialog-card" role="dialog" aria-modal="true">
        <h3><i class="fas fa-download icon"></i>安装选项</h3>
        <p id="install-dialog-pack-name" class="dialog-meta"></p>
        <label class="checkbox">
          <input id="install-overwrite-checkbox" type="checkbox" />
          <span>覆盖同名表情包</span>
        </label>
        <p class="dialog-tip">未勾选覆盖时，将自动为新安装包追加后缀。</p>
        <label class="checkbox">
          <input id="install-default-checkbox" type="checkbox" />
          <span>安装后设为默认</span>
        </label>
        <div class="dialog-actions">
          <button id="install-dialog-cancel" class="ghost" type="button">
            取消
          </button>
          <button id="install-dialog-confirm" type="button">确认安装</button>
        </div>
      </div>
    </div>

    <div
      id="install-progress-dialog"
      class="dialog-mask hidden"
      aria-hidden="true"
    >
      <div
        class="dialog-card progress-dialog-card"
        role="dialog"
        aria-modal="true"
        aria-labelledby="install-progress-title"
      >
        <h3 id="install-progress-title">
          <i class="fas fa-cloud-arrow-down icon"></i>正在安装表情包
        </h3>
        <p id="install-progress-pack-name" class="dialog-meta"></p>
        <div class="progress-summary" aria-live="polite">
          <span id="install-progress-phase">正在准备安装任务</span>
          <strong id="install-progress-percent">0%</strong>
        </div>
        <div
          id="install-progress-track"
          class="progress-track"
          role="progressbar"
          aria-label="安装进度"
          aria-valuemin="0"
          aria-valuemax="100"
          aria-valuenow="0"
        >
          <div id="install-progress-bar" class="progress-bar"></div>
        </div>
        <p id="install-progress-bytes" class="progress-bytes">等待下载开始…</p>
        <p class="dialog-tip">可以关闭后重新打开此页面，安装进度会自动恢复。</p>
        <div class="dialog-actions">
          <button id="install-progress-cancel" class="ghost" type="button">
            取消安装
          </button>
        </div>
      </div>
    </div>

    <script type="module" src="./script.js"></script>
  </body>
</html>
