<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>表情包设置中心</title>
    <link rel="stylesheet" href="./fa.min.css" />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header class="page-header">
      <div>
        <p class="eyebrow">Meme Pack Settings</p>
        <h1><i class="fas fa-sliders icon"></i>表情包设置中心</h1>
        <p class="subtitle">
          管理 persona/session/default 规则，并导出或还原运行时备份。
        </p>
      </div>
      <div class="nav-actions stacked-nav" aria-label="页面导航">
        <a
          class="nav-link nav-layer nav-layer-left"
          href="../semantic/index.html"
          data-nav-target="../semantic/index.html"
          ><i class="fas fa-chevron-left icon"></i>语义化</a
        >
        <a
          class="nav-link nav-layer nav-layer-center"
          href="../a_manage/index.html"
          data-nav-target="../a_manage/index.html"
          ><i class="fas fa-gear icon"></i>返回管理页</a
        >
        <a
          class="nav-link nav-layer nav-layer-right"
          href="../catalog/index.html"
          data-nav-target="../catalog/index.html"
          data-nav-view="catalog"
          ><i class="fas fa-chevron-right icon"></i>资源广场</a
        >
      </div>
    </header>

    <main class="layout">
      <section class="panel rules-panel">
        <div class="panel-head">
          <h2><i class="fas fa-route icon"></i>选择规则</h2>
          <div class="head-actions">
            <button id="add-rule-btn" class="secondary">新增规则</button>
            <button id="reload-rules-btn" class="ghost">重新加载</button>
          </div>
        </div>

        <p class="hint">规则按从上到下匹配，默认规则固定在最后。</p>
        <p class="hint">可拖拽非默认规则调整顺序，default 规则不可拖动。</p>

        <div id="rules-validation" class="validation hidden"></div>

        <div id="rules-list" class="rules-list"></div>

        <div class="save-row">
          <button id="save-rules-btn">
            <i class="fas fa-floppy-disk icon"></i>保存规则
          </button>
        </div>
      </section>

      <section class="panel backup-panel">
        <h2><i class="fas fa-box-archive icon"></i>运行时备份</h2>

        <div class="block pack-transfer-block">
          <h3>表情包迁移（单包）</h3>
          <p class="hint compact-hint">
            用于分享或备份当前单个表情包，不影响全量备份功能。
          </p>
          <div class="field-row">
            <label for="transfer-pack-select">当前表情包</label>
            <select
              id="transfer-pack-select"
              aria-label="选择迁移的表情包"
            ></select>
          </div>
          <p id="transfer-current-pack" class="result" aria-live="polite">
            正在读取当前表情包…
          </p>

          <details class="pack-transfer-section" open>
            <summary>
              <span class="pack-transfer-summary-icon share-icon">
                <i class="fas fa-file-export"></i>
              </span>
              <span>
                <strong>导出当前表情包</strong>
                <small>分享或迁回自己的环境</small>
              </span>
              <i class="fas fa-chevron-down pack-transfer-chevron"></i>
            </summary>
            <div class="pack-transfer-section-body">
              <div
                class="export-mode-list"
                role="radiogroup"
                aria-label="导出类型"
              >
                <label
                  class="export-mode-option selected"
                  for="export-mode-share"
                >
                  <input
                    id="export-mode-share"
                    name="export-mode"
                    type="radio"
                    value="share"
                    checked
                  />
                  <span>
                    <strong>分享版</strong>
                    <small>不带向量，可上传资源广场</small>
                  </span>
                  <em>推荐</em>
                </label>
                <label class="export-mode-option" for="export-mode-backup">
                  <input
                    id="export-mode-backup"
                    name="export-mode"
                    type="radio"
                    value="backup"
                  />
                  <span>
                    <strong>自用备份</strong>
                    <small id="vector-backup-hint">正在检查向量状态…</small>
                  </span>
                </label>
              </div>
              <button id="export-pack-download-btn" type="button">
                <i class="fas fa-download icon"></i>下载分享版
              </button>
              <p id="export-pack-result" class="result" aria-live="polite"></p>
            </div>
          </details>

          <details class="pack-transfer-section">
            <summary>
              <span class="pack-transfer-summary-icon import-icon">
                <i class="fas fa-file-import"></i>
              </span>
              <span>
                <strong>从压缩包导入</strong>
                <small>兼容新版与旧版表情包</small>
              </span>
              <i class="fas fa-chevron-down pack-transfer-chevron"></i>
            </summary>
            <div class="pack-transfer-section-body">
              <label
                id="pack-import-dropzone"
                class="pack-import-dropzone"
                for="pack-import-file"
              >
                <input
                  id="pack-import-file"
                  type="file"
                  accept=".zip,application/zip"
                />
                <i class="fas fa-cloud-arrow-up"></i>
                <span>
                  <strong id="pack-import-file-label"
                    >选择或拖入 zip 文件</strong
                  >
                  <small>先检查，不会立即覆盖</small>
                </span>
              </label>

              <div
                id="pack-import-preview"
                class="pack-import-preview hidden"
                aria-live="polite"
              >
                <div class="pack-import-preview-header">
                  <div>
                    <strong id="pack-import-preview-name">待导入表情包</strong>
                    <span id="pack-import-preview-format">正在识别格式</span>
                  </div>
                  <button
                    id="pack-import-reset-btn"
                    type="button"
                    class="secondary compact-btn"
                  >
                    重选
                  </button>
                </div>
                <dl class="pack-import-preview-stats">
                  <div>
                    <dt>图片</dt>
                    <dd id="pack-import-image-count">0</dd>
                  </div>
                  <div>
                    <dt>分类</dt>
                    <dd id="pack-import-category-count">0</dd>
                  </div>
                  <div>
                    <dt>语义</dt>
                    <dd id="pack-import-semantic-count">无</dd>
                  </div>
                  <div>
                    <dt>向量</dt>
                    <dd id="pack-import-vector-state">不包含</dd>
                  </div>
                </dl>
                <p
                  id="pack-import-warning"
                  class="pack-import-warning hidden"
                ></p>
                <div class="pack-import-options">
                  <label>
                    <input id="pack-import-set-default" type="checkbox" />
                    导入后设为默认表情包
                  </label>
                  <label>
                    <input id="pack-import-overwrite" type="checkbox" />
                    同名时覆盖现有表情包
                  </label>
                  <label>
                    <input id="pack-import-overwrite-manual" type="checkbox" />
                    同时覆盖本机人工描述、标签和图片文字
                  </label>
                </div>
                <button id="pack-import-confirm-btn" type="button">
                  <i class="fas fa-circle-check icon"></i>确认导入
                </button>
              </div>
              <p id="pack-import-result" class="result" aria-live="polite"></p>
            </div>
          </details>
        </div>

        <div class="block">
          <h3>导出</h3>
          <div class="field-row">
            <label for="backup-output-dir-input">导出目录（可选）</label>
            <input
              id="backup-output-dir-input"
              type="text"
              placeholder="留空则导出到默认 backup 目录"
            />
          </div>
          <button id="export-backup-btn">
            <i class="fas fa-file-export icon"></i>导出全量备份
          </button>
          <p id="export-result" class="result"></p>
        </div>

        <div class="block">
          <h3>导入</h3>
          <div class="field-row">
            <label for="backup-file-input">备份压缩包（zip）</label>
            <input id="backup-file-input" type="file" accept=".zip" />
          </div>
          <label class="checkbox">
            <input id="import-overwrite-checkbox" type="checkbox" />
            <span>覆盖同名 pack（恢复时清空并重建冲突目录）</span>
          </label>
          <button id="import-backup-btn" class="danger">
            <i class="fas fa-file-import icon"></i>导入全量备份
          </button>
          <p id="import-result" class="result"></p>
        </div>
      </section>

      <section class="panel log-panel">
        <h2><i class="fas fa-list-check icon"></i>操作日志</h2>
        <div id="log-list" class="log-list"></div>
      </section>
    </main>

    <script type="module" src="./script.js"></script>
  </body>
</html>
